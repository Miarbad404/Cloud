<script>

function add(msg, color) { log.innerHTML += '<div style="color:'+(color||"#fff")+'">'+msg+'</div>'; }

async function run() {

    var r2 = await supa.from("users").select("*").eq("login","admin").eq("password","admin123").single();
    if(r2.error) { add("ERREUR login: " + r2.error.message, "#f55"); }
    else { add("OK - User trouve: " + JSON.stringify(r2.data), "#0f0"); }
  } catch(e) {
    add("Exception: " + e.message, "#f55");
  }
}
run();
